<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- Wells Fargo stylized stagecoach icon + text -->
  <g fill="#dc2626">
    <!-- Simplified stagecoach wheel -->
    <circle cx="20" cy="28" r="10" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="20" cy="28" r="3" fill="#dc2626"/>
    <line x1="20" y1="18" x2="20" y2="22" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="38" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="10" y1="28" x2="14" y2="28" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="26" y1="28" x2="30" y2="28" stroke="#dc2626" stroke-width="1.5"/>
    <!-- Stagecoach body hint -->
    <rect x="12" y="8" width="16" height="12" rx="2" fill="none" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="42" y="24" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#dc2626">Wells Fargo</text>
</svg>